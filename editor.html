<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Editor · PROJECT Z</title>
<style>
  :root {
    --bg: #0d100c; --panel: #161b14; --panel2: #1d2419; --edge: #2c3526; --text: #e8ecd8; --dim: #8a957c;
    --accent: #9bd65a; --accent2: #5fd3ff; --warn: #ffb347; --bad: #ff5a4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, 'Segoe UI', Tahoma, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--edge); border-radius: 4px; }
  button { padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on, button.primary { background: #2f4520; border-color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  select, input[type=text], input[type=number] { padding: 4px 6px; }
  input[type=number] { width: 72px; }
  label { display: flex; align-items: center; gap: 6px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 14px; margin: 0 10px 0 0; letter-spacing: 1px; color: var(--accent); }
  header .grow { flex: 1; }
  #msg { color: var(--accent); min-width: 140px; }
  #msg.bad { color: var(--bad); }

  main { display: grid; grid-template-columns: 196px 1fr 380px; min-height: 0; }
  .side { background: var(--panel); border-right: 1px solid var(--edge); padding: 10px; overflow: auto; }
  .side.right { border-right: 0; border-left: 1px solid var(--edge); display: flex; flex-direction: column; padding: 0; }
  h3 { margin: 12px 0 6px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  h3:first-child { margin-top: 0; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tools button { text-align: left; padding: 6px 7px; font-size: 12px; }
  .tools kbd { float: right; color: var(--dim); font-size: 11px; }
  .pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .sw { aspect-ratio: 1; border: 2px solid #000; border-radius: 3px; cursor: pointer; position: relative; }
  .sw.sel { outline: 2px solid #fff; outline-offset: 1px; }
  .sw.erase { background: repeating-conic-gradient(#333 0 25%, #555 0 50%) 0 0 / 8px 8px; }
  .sw input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .checks label { margin: 4px 0; }
  .hint { color: var(--dim); font-size: 12px; }

  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #stage { flex: 1; overflow: auto; display: grid; place-items: center; background: #090b08; }
  #paint { image-rendering: pixelated; cursor: crosshair; box-shadow: 0 0 0 1px var(--edge); }
  #status { padding: 5px 10px; background: var(--panel); border-top: 1px solid var(--edge); color: var(--dim); display: flex; gap: 16px; }

  .tabs { display: flex; border-bottom: 1px solid var(--edge); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 9px 4px; border-bottom: 2px solid transparent; }
  .tabs button.on { border-bottom-color: var(--accent); background: var(--panel2); }
  .tab { padding: 10px; overflow: auto; flex: 1; min-height: 0; display: none; }
  .tab.on { display: block; }
  .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
  .row > span:first-child { min-width: 118px; color: var(--dim); }
  .list { display: flex; flex-direction: column; gap: 3px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--edge); border-radius: 4px; background: var(--panel2); cursor: pointer; }
  .item.sel { border-color: var(--accent); background: #24301c; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: var(--dim); }
  .item button { padding: 1px 6px; font-size: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; flex: none; }
  .warn { color: var(--warn); font-size: 12px; margin: 6px 0; }
  .explain { background: #10150e; border: 1px solid var(--edge); border-radius: 4px; padding: 8px; color: #c9d1b8; font-size: 12px; }
  .explain b { color: var(--accent2); font-weight: 600; }

  #previewBox { border-top: 1px solid var(--edge); padding: 8px 10px 10px; background: #10140e; }
  #preview { width: 100%; image-rendering: pixelated; background: #3a4632; border-radius: 4px; cursor: crosshair; display: block; }
  #previewBox .row button { flex: 1; }

  /* smaller screens: slimmer side panels, then everything stacked with the canvas on top */
  @media (max-width: 1250px) { main { grid-template-columns: 172px 1fr 330px; } }
  @media (max-width: 1000px) {
    html, body { height: auto; }
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    #center { order: 1; height: 58vh; }
    .side.right { order: 2; border-left: 0; border-top: 1px solid var(--edge); }
    .side.right .tab { max-height: 420px; }
    #left { order: 3; border-right: 0; border-top: 1px solid var(--edge); }
    .tools { grid-template-columns: repeat(3, 1fr); }
    .pal { grid-template-columns: repeat(12, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>PROJECT Z · GUN EDITOR</h1>
  <label>ปืน <select id="gunSel"></select></label>
  <button id="newBtn" title="เริ่มปืนใหม่แบบว่าง">ใหม่ (ว่าง)</button>
  <button id="undoBtn" title="Ctrl+Z">↶ ย้อน</button>
  <button id="redoBtn" title="Ctrl+Y">↷ ทำซ้ำ</button>
  <span class="grow"></span>
  <span id="msg"></span>
  <button id="saveBtn" class="primary" title="Ctrl+S - บันทึกลงโปรเจกต์ (assets/guns)">💾 บันทึก</button>
  <button id="testBtn" title="เปิดโหมดซ้อมยิงพร้อมปืนนี้ (บันทึกก่อน)">▶ ทดสอบในเกม</button>
  <button id="delBtn" class="danger" title="ลบไฟล์ปืนที่สร้าง/แก้ไว้ (ปืนเดิมของเกมจะกลับมา)">ลบ</button>
  <button id="backBtn">กลับเกม</button>
</header>
<main>
  <aside class="side" id="left"></aside>
  <section id="center">
    <div id="stage"><canvas id="paint"></canvas></div>
    <div id="status"><span id="stPos">-</span><span id="stTool"></span><span id="stPart"></span></div>
  </section>
  <aside class="side right">
    <div class="tabs" id="tabs"></div>
    <div class="tab" id="tab-parts"></div>
    <div class="tab" id="tab-points"></div>
    <div class="tab" id="tab-reload"></div>
    <div class="tab" id="tab-stats"></div>
    <div id="previewBox">
      <canvas id="preview" width="400" height="220"></canvas>
      <div class="row">
        <button id="pvFire" title="กดค้างที่ภาพตัวอย่างก็ยิงได้">ยิง</button>
        <button id="pvReload" title="R">รีโหลด</button>
        <button id="pvSlow" title="ดูท่าช้าๆ">ช้า ×¼</button>
        <button id="pvMods" title="ติดของแต่งทดลอง">ของแต่ง</button>
      </div>
      <div class="hint">เมาส์บนภาพ = เล็ง · คลิกค้าง = ยิง · R = รีโหลด</div>
    </div>
  </aside>
</main>
<script type="module" src="src/editor/editor.js"></script>
</body>
</html>
